name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumina_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: lumina_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumina_user -d lumina_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lumina_user:ci_password@localhost:5432/lumina_db
      DATABASE_URL_SYNC: postgresql+psycopg://lumina_user:ci_password@localhost:5432/lumina_db
      PGURL: postgresql://lumina_user:ci_password@localhost:5432/lumina_db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client
      - run: pip install -r requirements.txt
      # Cùng cách dựng DB như docker-compose: schema.sql rồi Alembic (các migration idempotent).
      - run: psql "$PGURL" -v ON_ERROR_STOP=1 -f ../schema.sql
      - run: alembic upgrade head
      # Chỉ các test không gọi LLM/Ollama/Azure (không có key trong CI).
      - run: >-
          pytest -q
          tests/test_auth_integration.py tests/test_extension_scope.py tests/test_chunking.py
          tests/test_dictation_grading.py tests/test_subtitles.py tests/test_vocab.py
          tests/test_vocab_practice.py tests/test_rearrange.py tests/test_gamification.py
          tests/test_activity.py tests/test_adaptive.py tests/test_reading_lookup.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-reference/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx vite build
