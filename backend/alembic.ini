[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# QUAN TRỌNG: KHÔNG hardcode sqlalchemy.url ở đây bằng URL thật (asyncpg hay
# psycopg2). Alembic chạy đồng bộ, không hỗ trợ tốt driver async, nên URL
# thật (DATABASE_URL_SYNC, đọc từ app/core/config.py) phải được set động
# trong migrations/env.py bằng:
#     from app.core.config import settings
#     config.set_main_option("sqlalchemy.url", settings.DATABASE_URL_SYNC)
# Dòng dưới đây chỉ là placeholder để alembic không báo thiếu config khi
# chưa có env.py, sẽ luôn bị ghi đè lúc runtime.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S