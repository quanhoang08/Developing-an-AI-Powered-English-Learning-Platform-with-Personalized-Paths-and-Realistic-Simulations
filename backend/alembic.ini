[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# IMPORTANT: Do not hardcode the real sqlalchemy.url here. Alembic runs
# synchronously, so the configured sync URL must be set in migrations/env.py:
#     from app.core.config import settings
#     config.set_main_option("sqlalchemy.url", settings.database_url_sync)
# The value below is only a placeholder and is overwritten at runtime.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S