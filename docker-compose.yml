services:
  db:
    # pgvector/pgvector image = Postgres chính thức đã cài sẵn extension pgvector,
    # tránh phải tự build image Postgres riêng chỉ để thêm 1 extension.
    image: pgvector/pgvector:pg16
    container_name: lumina_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # schema.sql chỉ chạy 1 LẦN DUY NHẤT lúc container tạo volume lần đầu
      # (cơ chế docker-entrypoint-initdb.d của image Postgres chính thức).
      # Từ sau lần đầu, mọi thay đổi schema phải đi qua Alembic migration,
      # KHÔNG sửa tay schema.sql rồi mong container tự áp dụng lại.
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumina_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Ghi đè DATABASE_URL để trỏ vào service "db" trong cùng network compose,
      # thay vì localhost — bên trong container, "db" là hostname do Docker
      # DNS nội bộ cấp, không phải 127.0.0.1.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Ollama chạy trên máy host, không nằm trong compose: "localhost" trong container là chính
      # container nên phải trỏ qua host.docker.internal. Chỉ ghi đè ở đây, không sửa .env — chạy
      # backend/pytest trực tiếp trên máy vẫn cần localhost.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    # Docker Desktop (Windows/Mac) tự có host.docker.internal; dòng này để Linux cũng chạy được.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount code để dev có hot-reload mà không cần rebuild image mỗi lần sửa file.
      - ./backend/app:/app/app
      # Mount migrations/tests/alembic.ini để `docker compose exec api alembic upgrade head` và
      # pytest luôn dùng bản mới nhất trên máy, không phụ thuộc lần build image gần nhất.
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/pytest.ini:/app/pytest.ini
      # Mount storage để file upload/audio không mất khi container restart/rebuild.
      - ./backend/storage:/app/storage
    # --reload (watchfiles) bị bỏ: sau nhiều lần rebuild trong 1 phiên dev dài, watcher gặp
    # "Cannot allocate memory (os error 12)" — giới hạn inotify của Docker Desktop/WSL2 VM,
    # không phải hết RAM thật (container chỉ dùng ~140MB). Do luôn rebuild thủ công
    # (`docker compose up -d --build`) sau mỗi lần sửa code, --reload không còn cần thiết.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data: