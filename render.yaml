# Render Blueprint: New > Blueprint > chọn repo này. Mục có `sync: false` phải điền tay trên dashboard.
databases:
  - name: lumina-db
    postgresMajorVersion: "16"
    plan: basic-256mb   # kiểm tra tên gói hiện hành trên trang giá Render

services:
  - type: web
    name: lumina-api
    runtime: docker
    rootDir: backend
    plan: starter        # gói miễn phí tự ngủ và không chạy được preDeployCommand
    healthCheckPath: /docs
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: checksPass   # chỉ deploy khi GitHub Actions CI xanh
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: lumina-db, property: connectionString }
      - key: DATABASE_URL_SYNC
        fromDatabase: { name: lumina-db, property: connectionString }
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        sync: false        # JSON list, vd ["https://lumina.vercel.app"]
      - key: GOOGLE_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false        # Speaking/Listening: nhận dạng giọng + chấm phát âm
      - key: AZURE_SPEECH_REGION
        sync: false        # đúng region của key Azure, vd japaneast
      - key: ELEVENLABS_API_KEY
        sync: false        # TTS podcast từ tài liệu .docx (tuỳ chọn)
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false        # sender đã xác minh trong Brevo
